generated: '2026-07-18'
method: searched
source: https://capmoapi.readme.io/reference/errors
format: custom-json
envelope:
  content_type: application/json
  shape: '{ "type": string (link to error docs), "message": string, "errors": [ { "code": string, "message":
    string } ] }'
  note: Not RFC 9457 problem+json. The `type` field links to the errors glossary; per-field validation
    issues are itemized in `errors[]`.
problems:
- status: 400
  code: BAD_REQUEST
  title: Bad Request
  remediation: Malformed request syntax, invalid framing, or payload too large. Validate request payload
    and parameters against the docs.
  docs: https://capmoapi.readme.io/reference/errors
- status: 401
  code: UNAUTHORIZED
  title: Unauthorized
  remediation: 'Missing or invalid API key. Send Authorization: "Capmo <API_KEY>"; verify the key is valid
    and not revoked.'
  docs: https://capmoapi.readme.io/reference/errors
- status: 403
  code: FORBIDDEN
  title: Forbidden
  remediation: Authenticated but not permitted. Verify the API-key user has access/permissions to the
    resource.
  docs: https://capmoapi.readme.io/reference/errors
- status: 404
  code: NOT_FOUND
  title: Not Found
  remediation: Resource does not exist or the URL/identifier is incorrect. Double-check the id and path.
  docs: https://capmoapi.readme.io/reference/errors
- status: 409
  code: CONFLICT
  title: Conflict
  remediation: Request conflicts with the current state of the resource (e.g. duplicate/already-exists).
  docs: https://capmoapi.readme.io/reference/errors
- status: 429
  code: TOO_MANY_REQUESTS
  title: Too Many Requests
  remediation: Exceeded 600 requests/minute. Throttle or back off; consult the x-rate-limit-reset header.
  docs: https://capmoapi.readme.io/reference/errors
- status: 500
  code: INTERNAL_SERVER_ERROR
  title: Internal Server Error
  remediation: Unexpected server error. Retry with backoff; contact support if it persists.
  docs: https://capmoapi.readme.io/reference/errors
