entities:
- name: Organisation
  description: Top-level tenant that owns projects, contact-book people/companies and memberships.
- name: OrganisationPerson
  description: A person in the organisation contact book.
- name: OrganisationCompany
  description: A company in the organisation contact book.
- name: OrganisationMembership
  description: Membership linking an organisation person to the organisation.
- name: Project
  description: A construction project; the primary aggregate root under an organisation.
- name: ProjectTemplate
  description: Reusable template a project can be created from.
- name: ProjectPerson
  description: A person in a project contact book (may reference a company).
- name: ProjectCompany
  description: A company in a project contact book.
- name: ProjectMembership
  description: Membership linking a project person to a project with a permission set.
- name: ProjectPermissionSet
  description: Named set of project permissions used when inviting members.
- name: Document
  description: A project document file, stored in a document folder.
- name: DocumentFolder
  description: Folder hierarchy for project documents.
- name: Plan
  description: A project plan file, stored in a plan folder.
- name: PlanFolder
  description: Folder hierarchy for project plans.
- name: ProjectTicket
  description: A ticket (defect/task) with category, type, tags, comments and attachments.
- name: TicketCategory
  description: Category for project tickets.
- name: TicketType
  description: Type for project tickets.
- name: ProjectTicketTag
  description: Tag applied to project tickets.
- name: ProjectTicketComment
  description: Comment on a project ticket (token-paginated).
- name: TicketAttachment
  description: File attachment on a project ticket.
- name: RoomListing
  description: Room listing within a project (self-referential parent).
- name: SiteJournal
  description: Site/construction journal entry with attendances, visits and weather observations.
- name: ChangeOrder
  description: A change order following a workflow step.
- name: ChangeOrderStep
  description: A workflow step available for change orders.
