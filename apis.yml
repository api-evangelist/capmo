aid: capmo
name: Capmo
description: >-
  Capmo is a Munich-based construction project management platform ("Bauprojektmanagement-Software")
  for the DACH market, backed by Bessemer Venture Partners. Its web and mobile apps cover defect and
  task management (tickets), site journals (Bautagebuch), plans, documents, change orders, project and
  organisation contact books, and reporting for construction teams. Capmo exposes a public REST API
  (api.capmo.de, /api/v1) documented on ReadMe, with API-key authentication, cursor pagination, a
  600 requests/minute rate limit, HMAC-signed webhooks for change-order events, and downloadable
  OpenAPI specifications for both the REST and Webhook surfaces.
