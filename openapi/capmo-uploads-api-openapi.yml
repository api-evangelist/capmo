components:
  schemas:
    WritePlanFileUploadDto:
      type: object
      properties:
        name:
          type: string
          example: A-2-EG2.pdf
          description: The name of the file, including the file extension.
      required:
      - name
    ReadPlanFileUploadDto:
      type: object
      properties:
        upload_url:
          type: string
          example: https://example.com/upload-url
          description: The upload URL for the file.
        data_path:
          type: string
          example: tmp/d53e8d26-ed1e-11ee-82f7-df9b7663c64f/0a963a56-d21f-40e7-bf1f-36c0f5b1cafb
          description: The unique identifier of the file.
        expires:
          type: number
          example: 3600
          description: The expiration time in seconds of the upload URL.
        fields:
          type: object
          description: Additional fields required for the upload.
          example:
            Content-Type: application/pdf
            bucket: <bucket-name>
            X-Amz-Algorithm: AWS4-HMAC-SHA256
            X-Amz-Credential: <string>
            X-Amz-Date: 20240429T034549Z
            X-Amz-Security-Token: <string>
            key: tmp/9357781c-05da-11ef-9539-7b47b1fda975/eae0751a-9e89-4ff3-98a9-d4cb31f2a792
            Policy: <string>
            X-Amz-Signature: <string>
      required:
      - upload_url
      - data_path
      - expires
      - fields
    ReadDocumentFileUploadDto:
      type: object
      properties:
        upload_url:
          type: string
          example: https://example.com/upload-url
          description: The upload URL for the file.
        data_path:
          type: string
          example: tmp/d53e8d26-ed1e-11ee-82f7-df9b7663c64f/0a963a56-d21f-40e7-bf1f-36c0f5b1cafb
          description: The unique identifier of the file.
        expires:
          type: number
          example: 3600
          description: The expiration time in seconds of the upload URL.
        fields:
          type: object
          description: Additional fields required for the upload.
          example:
            Content-Type: application/pdf
            bucket: <bucket-name>
            X-Amz-Algorithm: AWS4-HMAC-SHA256
            X-Amz-Credential: <string>
            X-Amz-Date: 20240429T034549Z
            X-Amz-Security-Token: <string>
            key: tmp/9357781c-05da-11ef-9539-7b47b1fda975/eae0751a-9e89-4ff3-98a9-d4cb31f2a792
            Policy: <string>
            X-Amz-Signature: <string>
      required:
      - upload_url
      - data_path
      - expires
      - fields
    ReadTicketAttachmentUploadDto:
      type: object
      properties:
        upload_url:
          type: string
          example: https://example.com/upload-url
          description: The upload URL for the file.
        data_path:
          type: string
          example: tmp/d53e8d26-ed1e-11ee-82f7-df9b7663c64f/0a963a56-d21f-40e7-bf1f-36c0f5b1cafb
          description: The unique identifier of the file.
        expires:
          type: number
          example: 3600
          description: The expiration time in seconds of the upload URL.
        fields:
          type: object
          description: Additional fields required for the upload.
          example:
            Content-Type: application/pdf
            bucket: <bucket-name>
            X-Amz-Algorithm: AWS4-HMAC-SHA256
            X-Amz-Credential: <string>
            X-Amz-Date: 20240429T034549Z
            X-Amz-Security-Token: <string>
            key: tmp/9357781c-05da-11ef-9539-7b47b1fda975/eae0751a-9e89-4ff3-98a9-d4cb31f2a792
            Policy: <string>
            X-Amz-Signature: <string>
      required:
      - upload_url
      - data_path
      - expires
      - fields
    WriteTicketAttachmentUploadDto:
      type: object
      properties:
        name:
          type: string
          example: A-2-EG2.pdf
          description: The name of the file, including the file extension.
      required:
      - name
    WriteDocumentFileUploadDto:
      type: object
      properties:
        mime_type:
          type: string
          nullable: true
          description: The mime type of the file.
          example: application/pdf
      required:
      - mime_type
  securitySchemes:
    CapmoAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'For authentication, use the custom prefix followed by a space and then your API key. Example: "Capmo YOUR_API_KEY".'
x-readme:
  headers:
  - key: Request-Id
    value: YOUR_REQUEST_ID
