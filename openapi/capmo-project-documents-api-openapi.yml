components:
  schemas:
    ReadDocumentFolderDto:
      type: object
      properties:
        source_id:
          type: string
          description: The unique identifier of the source. This is a user-generated string. You can use this to link the person to a resource in an external system.
          example: 123e4567-e89b-12d3-a456-426614174000
        created_by:
          type: string
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier of the creator of the entity.
        updated_by:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          nullable: true
          description: The unique identifier of the last user who updated the entity.
        created_at:
          type: string
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was created (on the client).
        updated_at:
          type: string
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was last updated (on the client).
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier of the document folder.
        name:
          type: string
          example: Inspektionsfotos (Mai 2024)
          description: The name of the document folder.
        parent_folder_id:
          type: string
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique ID of the folder's parent. When not provided, the folder has no parent and will be placed in the root folder.
      required:
      - created_by
      - updated_by
      - created_at
      - updated_at
      - id
      - name
      - parent_folder_id
    PaginatedOutputDto:
      type: object
      properties:
        after:
          type: string
          example: null
        count:
          type: number
          example: 1
        total:
          type: number
          example: 1
      required:
      - after
      - count
      - total
    FileCreateInputDto:
      type: object
      properties:
        source_id:
          type: string
          description: The unique identifier of the source. This is a user-generated string. You can use this to link the person to a resource in an external system.
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: The name of the file.
          example: Report_2024.pdf
        data_path:
          type: string
          description: The data path of the file.
          example: tmp/9357781c-05da-11ef-9539-7b47b1fda975/eae0751a-9e89-4ff3-98a9-d4cb31f2a792
        on_duplicate:
          type: string
          enum:
          - forbid
          - rename
          - replace
          description: The optional enum to configure how duplicate files are handled.
          example: replace
        event_id:
          type: string
          description: "This is an optional field that should be used to track activity when multiple files are being created. e.g. when you create a single file you don't need it,\n       but when you create more than one file together, you should use the same event_id for all files. So we can correctly group them into one activity"
          example: 123e4567-e89b-12d3-a456-426614174000
        folder_id:
          type: string
          description: The `folderId` where the file should be created. When not present, the file will be placed at the root directory.
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
      - name
      - data_path
    ReadDocumentDto:
      type: object
      properties:
        source_id:
          type: string
          description: The unique identifier of the source. This is a user-generated string. You can use this to link the person to a resource in an external system.
          example: 123e4567-e89b-12d3-a456-426614174000
