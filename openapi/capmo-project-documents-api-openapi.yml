  /api/v1/projects/{projectId}/document-folders:
    get:
      description: This can be used to list all project document folders in a paginated response.
      operationId: getProjectDocumentFolders
      parameters:
      - name: projectId
        required: true
        in: path
        schema:
          type: string
      - name: order_direction
        required: false
        in: query
        description: Order direction of the `order_by` field. It can be `asc` or `desc`.
        schema:
          default: asc
          example: asc
          type: string
          enum:
          - asc
          - desc
      - name: after
        required: false
        in: query
        description: The last element from the previous page. This is a cursor. It will be returned in the output to be used in the next request. When it is not present, the first page is returned. When it is `null`, there are no more pages.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: How many items should be in the output.
        schema:
          minimum: 1
          maximum: 1000
          default: 200
          example: 20
          type: number
      - name: parent_folder_id
        required: false
        in: query
        description: The unique identifier of the document folder's parent folder ID.
        schema:
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
      - name: include_sub_folders
        required: false
        in: query
        description: Whether the response should include all sub-folders or not.
        schema:
          example: true
          type: boolean
      - name: order_by
        required: false
        in: query
        description: The field to order the document folders by.
        schema:
          default: created_at
          example: name
          type: string
      - name: query
        required: false
        in: query
        description: Can be used to search for a document folder by a partial match on its name.
        schema:
          example: fotos
          type: string
      - name: folder_ids
        required: false
        in: query
        description: Can be used to filter the results to a list of document folders IDs.
        schema:
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          - 123e4567-e89b-12d3-a456-426614174001
          - 123e4567-e89b-12d3-a456-426614174002
