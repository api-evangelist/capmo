        project_status:
          example: PROJECT_PREPARATION
          nullable: true
          description: The phase of the project.
          allOf:
          - $ref: '#/components/schemas/ProjectStatus'
        project_volume:
          type: integer
          nullable: true
          example: 500000000
          description: The volume of the project (in Euros).
