        schema: {}
      requestBody:
        required: true
        description: The data required to update a project site journal.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteJournalDto'
      responses:
        '200':
          description: The project site journal has been successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
