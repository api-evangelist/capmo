components:
  schemas:
    SiteJournalCustomTextDto:
      type: object
      properties:
        text:
          type: string
          nullable: true
          description: Free-form text content for this custom text entry.
          example: Foundation work completed on the east wing.
      required:
      - text
    SiteJournalVisitDto:
      type: object
      properties:
        started_at:
          type: string
          nullable: true
          example: '11:00'
          description: The start time (HH:mm) of a specific project stakeholder visit.
        ended_at:
          type: string
          nullable: true
          example: '12:00'
          description: The end time (HH:mm) of a specific project stakeholder visit.
        visitor_id:
          type: string
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier (UUID) of the contact person who visited.
        qualification:
          type: string
          nullable: true
          enum:
          - CONSTRUCTION_WORKER
          - SITE_MANAGER
          - SKILLED_WORKER
          - HELPER
          - ASSISTANT_WORKER
          - FOREMAN
          - FITTER
          - ASSEMBLY_SUPERVISOR
          - SENIOR_SITE_MANAGER
          - SENIOR_FITTER
          - SENIOR_FOREMAN
          - FOREMAN_CONSTRUCTION
          - PROJECT_MANAGER
          - PROJECT_PLANNER
          - SUPERVISOR
          - MASTER_FOREMAN
          - OTHER
          example: CONSTRUCTION_WORKER
          description: The job title/qualification of the visitor.
      required:
      - started_at
      - ended_at
      - visitor_id
      - qualification
    PaginatedOutputDto:
      type: object
      properties:
        after:
          type: string
          example: null
        count:
          type: number
          example: 1
        total:
          type: number
          example: 1
      required:
      - after
      - count
      - total
    CreateSiteJournalDto:
      type: object
      properties:
        source_id:
          type: string
          description: The unique identifier of the source. This is a user-generated string. You can use this to link the person to a resource in an external system.
          example: 123e4567-e89b-12d3-a456-426614174000
        date:
          type: string
          description: The date of the site journal in ISO format (YYYY-MM-DD).
          example: '2025-01-13'
        visits:
          description: Records the time intervals of visits.
          type: array
          items:
            $ref: '#/components/schemas/SiteJournalVisitDto'
        weather_observation:
          type: object
          description: The description of the weather for the given day.
        company_attendances:
          description: Describes the attendance, namely how many people and which company they belong.
          type: array
          items:
            $ref: '#/components/schemas/SiteJournalCompanyAttendanceDto'
        custom_texts:
          description: Free-form custom text entries.
          type: array
          items:
            $ref: '#/components/schemas/SiteJournalCustomTextDto'
      required:
      - date
    UpdateSiteJournalDto:
      type: object
      properties:
        source_id:
          type: string
          description: The unique identifier of the source. This is a user-generated string. You can use this to link the person to a resource in an external system.
          example: 123e4567-e89b-12d3-a456-426614174000
        date:
          type: string
          description: The date of the site journal in ISO format (YYYY-MM-DD).
          example: '2025-01-13'
        visits:
          description: Records the time intervals of visits.
          type: array
          items:
            $ref: '#/components/schemas/SiteJournalVisitDto'
        weather_observation:
          type: object
          description: The description of the weather for the given day.
        company_attendances:
          description: Describes the attendance, namely how many people and which company they belong.
          type: array
          items:
            $ref: '#/components/schemas/SiteJournalCompanyAttendanceDto'
        custom_texts:
          description: Free-form custom text entries.
          type: array
          items:
            $ref: '#/components/schemas/SiteJournalCustomTextDto'
    SiteJournalWorkerEntryDto:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier (UUID) of the worker entry.
        started_at:
          type: string
          nullable: true
          example: 08:00
          description: The start time (HH:mm) of the worker entry.
        ended_at:
          type: string
          nullable: true
          example: '17:00'
          description: The end time (HH:mm) of the worker entry.
        duration:
          type: number
          nullable: true
          example: 480
          description: Duration in minutes.
        worker_id:
          type: string
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier (UUID) of the worker (contact book person).
        qualification:
          type: string
          nullable: true
          enum:
          - CONSTRUCTION_WORKER
          - SITE_MANAGER
          - SKILLED_WORKER
          - HELPER
          - ASSISTANT_WORKER
          - FOREMAN
          - FITTER
          - ASSEMBLY_SUPERVISOR
          - SENIOR_SITE_MANAGER
          - SENIOR_FITTER
          - SENIOR_FOREMAN
          - FOREMAN_CONSTRUCTION
          - PROJECT_MANAGER
          - PROJECT_PLANNER
          - SUPERVISOR
          - MASTER_FOREMAN
          - OTHER
          example: CONSTRUCTION_WORKER
          description: The qualification of the worker.
      required:
      - id
      - started_at
      - ended_at
      - duration
      - worker_id
      - qualification
