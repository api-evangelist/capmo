components:
  schemas:
    CreateOrganisationPersonDto:
      type: object
      properties:
        source_id:
          type: string
          description: The unique identifier of the source. This is a user-generated string. You can use this to link the person to a resource in an external system.
          example: 123e4567-e89b-12d3-a456-426614174000
        first_name:
          type: string
          description: The first name of the person.
          example: John
          maxLength: 255
        last_name:
          type: string
          description: The last name of the person.
          example: Doe
          maxLength: 255
        email:
          type: string
          description: The email address of the person.
          example: john.doe@example.com
          maxLength: 255
        position:
          type: string
          description: The position of the person.
          example: accountant
          maxLength: 255
        phone_number:
          type: string
          description: The phone number of the person. It must consist of between 1 and 15 digits and an optional leading "+" character.
          example: '+491764445566'
        company_id:
          type: string
          description: The company ID assigned to the person.
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
      - first_name
      - last_name
      - email
    ReadOrganisationPersonDto:
      type: object
      properties:
        source_id:
          type: string
          description: The unique identifier of the source. This is a user-generated string. You can use this to link the person to a resource in an external system.
          example: 123e4567-e89b-12d3-a456-426614174000
        created_by:
          type: string
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier of the creator of the entity.
        updated_by:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          nullable: true
          description: The unique identifier of the last user who updated the entity.
        created_at:
          type: string
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was created (on the client).
        updated_at:
          type: string
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was last updated (on the client).
        deleted_at:
          type: string
          nullable: true
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was deleted (on the client).
        server_created_at:
          type: string
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was created (on the server).
        server_updated_at:
          type: string
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was last updated (on the server).
        server_deleted_at:
          type: string
          nullable: true
          format: date-time
          example: '2021-07-01T00:00:00.000Z'
          description: The date when the entity was deleted (on the server).
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier of the person.
        first_name:
          type: string
          example: John
          description: The first name of the person.
        last_name:
